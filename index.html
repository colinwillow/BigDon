<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + the safe-area insets in the CSS is what keeps the
     sticks clear of the home indicator and the notch on a real phone. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1867b5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Big Don">
<title>Big Don</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- ADD TO HOME SCREEN.
     iOS reads these apple-touch-icon tags and IGNORES the manifest, which is
     why the sizes are listed twice. The art is full-bleed with no rounded
     corners baked in: iOS masks the corners itself, and pre-rounded art shows
     its own corners as dark notches inside that mask. Android uses the
     manifest, including the separate maskable variants.
     Regenerate every size with: python3 tools/make-icons.py -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/apple-touch-icon-120.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<canvas id="game"></canvas>

<!-- ── TOUCH CONTROLS ──────────────────────────────────────────────────────
     Two invisible half-screen zones. The visible ring and knob are moved to
     wherever the thumb lands, so there is nothing to aim for and nothing to
     look at. -->
<div id="zone-left" class="stick-zone"></div>
<div id="zone-right" class="stick-zone"></div>
<div id="ring-left" class="stick-ring"></div>
<div id="knob-left" class="stick-knob"></div>
<div id="ring-right" class="stick-ring"></div>
<div id="knob-right" class="stick-knob"></div>

<!-- ── HUD ─────────────────────────────────────────────────────────────── -->
<div id="hud">
  <span id="hud-state">—</span>
  <span id="hud-speed">0.0 m/s</span>
  <span id="hud-fps">— fps</span>
  <span id="hud-gesture">—</span>
  <span id="hud-clips"></span>
</div>

<div id="legend">
  <div class="legend-touch">
    <b>LEFT</b> move · flick slide · tap centre camera<br>
    <b>RIGHT</b> push aim/shoot · flick melee · tap jump
  </div>
  <div class="legend-kbm">
    <b>WASD</b> move · <b>SPACE</b> jump ×2 · <b>SHIFT</b> slide · <b>V</b> melee<br>
    <b>drag</b> camera · <b>Q</b>/<b>E</b> turn · <b>R</b> centre
  </div>
</div>

<div id="boot"><div class="boot-inner"><p>loading…</p></div></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
